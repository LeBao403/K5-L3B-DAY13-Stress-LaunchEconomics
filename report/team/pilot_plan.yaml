# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (hệ số thiết kế 1)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; 1.251 x 2,48 = 3.103 yêu cầu mỗi nhóm = 42 người mỗi nhóm, tổng 84, lớn hơn 40 nhân viên hiện có, không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 20 / 0,02 = 1.000, thấp hơn 1.251, không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 6 / 0,02 = 300, chỉ 6 cụm
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi nhân viên (DE = 6,96, hiệu dụng 859)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng quyền truy cập theo tài khoản và ghi log lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   20 nhân viên mỗi nhóm chưa đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 so với 1.251 cần có).
#   Nhóm chấp nhận mức chênh 6 điểm (859 mỗi nhóm), mỗi nhân viên cần ít nhất 299 yêu cầu.
#   Nếu tác động thật chỉ là 5 điểm thì power còn khoảng 0,64 thay vì 0,80 (n = 859, NormalIndPower).
#   Giám đốc vận hành ký chấp nhận đánh đổi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang 3,97% (39/982).
#   Ngưỡng tuyệt đối 3% thấp hơn tỉ lệ hiện tại nên pilot sẽ bị dừng ngay tuần đầu, không dùng.
#   Ngưỡng đã chọn: nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên, hoặc vượt trần tuyệt đối 6% (cao hơn 3,97% hiện tại).
#
# Số liệu trong file chú thích mà tính từ cột simulated có nhãn simulated: ngưỡng chi phí 8.000 đ và phần so sánh với 12.000 đ.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"   # người có quyền bật và tắt pilot
  scope: "Chỉ noi_dia và hang_nang (chi phí mỗi việc thành công 2.696 đ = 0,22x và 8.221 đ = 0,69x so với 12.000 đ, simulated); loại quoc_te (22.515 đ = 1,88x, thành công 27,3%, simulated) và doi_tac (10.215 đ = 0,85x, có điều khoản riêng, simulated) không đưa vào"
  assignment:
    unit: "staff"                    # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4, 10, 20 nhân viên dùng trợ lý
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # mức chênh 6 điểm, đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, không dùng trợ lý"
    spillover_risk: "Chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu; seed bốc thăm ghi trước"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt 6% TRONG 1 tuần đánh giá THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Trưởng nhóm CSKH rà 20 trace mở lại trong 3 ngày KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công của phạm vi pilot vượt 8.000 đ (simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy trong 5 ngày KHÔNG THÌ không được mở hang_nang cho thêm nhân viên"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý (sua hoặc bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày để tìm nguyên nhân KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm 6 phút mỗi yêu cầu"
  decision_date: "2027-01-05"     # chốt trước ngày bắt đầu; ba tuần rollout cộng 7 ngày theo dõi mở lại
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi phí mỗi việc thành công theo loại và so với 12.000 đ (tính từ hai cột trên)", "ngưỡng chi phí 8.000 đ"]
